/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

:root[data-theme='light'] {
  --bg: #efece6;
  --fg: #1f1b16;
  --dim: rgba(31, 27, 22, 0.68);
  --mute: rgba(31, 27, 22, 0.46);
  --line: rgba(31, 27, 22, 0.13);
  --panel: rgba(255, 255, 255, 0.66);
  --accent: #e3701b;
  --agua: #2f7fe0;
}
html, body { background: var(--bg); }
#app { position: fixed; inset: 0; font-family: 'Inter', system-ui, sans-serif; font-size: 13px; line-height: 1.4; color: var(--fg); }
.tela {
  position: absolute; inset: 0; display: grid;
  grid-template-columns: minmax(250px, 290px) 1fr minmax(250px, 300px);
  grid-template-rows: auto 1fr auto;
  grid-template-areas: 'cab cab cab' 'esq palco dir' 'barra barra barra';
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.tela.sem-paineis { grid-template-columns: 0 1fr 0; }
.tela.sem-paineis .lado-esq, .tela.sem-paineis .lado-dir { display: none; }

.cab { grid-area: cab; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding: 14px 20px 6px; }
.titulo h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.titulo p { margin: 2px 0 0; color: var(--mute); font-size: 12px; }
.principal { display: grid; justify-items: end; text-align: right; }
.principal .rot { color: var(--dim); font-size: 12px; }
.principal .num { font-family: 'JetBrains Mono', monospace; line-height: 1; }
.principal .num b { font-size: 40px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.principal .num i { font-style: normal; font-size: 16px; margin-left: 4px; color: var(--dim); }
.principal .sub { color: var(--mute); font-size: 11.5px; font-family: 'JetBrains Mono', monospace; }

.lado-esq { grid-area: esq; }
.lado-dir { grid-area: dir; }
.lado-esq, .lado-dir { display: flex; flex-direction: column; gap: 10px; padding: 6px 12px; overflow-y: auto; min-height: 0; }
.cartao { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.cartao h2 { margin: 0 0 8px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; display: flex; justify-content: space-between; gap: 8px; }
.cartao h2 small { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--mute); }
.nota { margin: 8px 0 0; color: var(--mute); font-size: 11px; }

.hid-linha { display: grid; grid-template-columns: 74px 1fr 14px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center; padding: 4px 0; border-top: 1px solid var(--line); }
.hid-linha:first-child { border-top: 0; }
.hid-linha .nome { font-weight: 600; font-size: 12px; }
.hid-linha .ser { height: 9px; border: 1px solid rgba(47, 127, 224, 0.45); border-radius: 5px; background: rgba(255, 255, 255, 0.7); overflow: hidden; }
.hid-linha .agua { display: block; height: 100%; background: var(--agua); opacity: 0.75; }
.hid-linha .seta { text-align: center; color: var(--mute); font-family: 'JetBrains Mono', monospace; }
.hid-linha .ml { grid-column: 2 / 5; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dim); text-align: center; }
.hid-linha.ativa .nome, .junta.ativa .nome { color: var(--accent); }
.hid-linha.ativa .seta { color: var(--accent); font-weight: 700; }

.forcas { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
.forcas dt { color: var(--dim); }
.forcas dd { margin: 0; text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
.forcas dd span { display: block; font-weight: 400; color: var(--mute); font-size: 11px; }

.junta { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 4px 0; }
.junta .nome { font-weight: 600; font-size: 12px; }
.junta .val { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
.junta .faixa { grid-column: 1 / 3; position: relative; height: 4px; border-radius: 2px; background: var(--line); }
.junta .faixa i { position: absolute; top: -3px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--fg); }
.junta.ativa .faixa i { background: var(--accent); }

.esquema { display: block; width: 100%; height: 190px; }
.grafico { display: block; width: 100%; height: 110px; }
.leg::before { content: ''; display: inline-block; width: 10px; height: 2px; margin-right: 4px; vertical-align: middle; }
.leg.o::before { background: var(--accent); }
.leg.c::before { background: var(--agua); }

.palco-area { grid-area: palco; position: relative; min-width: 0; min-height: 0; }
#palco { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.linhas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.linhas line { stroke: rgba(31, 27, 22, 0.55); stroke-width: 1; }
.linhas circle { fill: var(--fg); }
.rotulos { position: absolute; inset: 0; pointer-events: none; }
.rotulo { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.85); border: 1px solid var(--line); }
.sem-legendas .linhas, .sem-legendas .rotulos { display: none; }

.barra { grid-area: barra; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: center; padding: 8px 12px 12px; }
.grupo-bt { display: flex; flex-wrap: wrap; gap: 4px; }
.barra button {
  font: inherit; font-size: 12.5px; font-weight: 600; min-height: 34px; padding: 6px 12px; cursor: pointer;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
}
.barra button:hover { border-color: var(--accent); }
.barra button[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #fff; }
.barra button:focus-visible { outline: 3px solid var(--agua); outline-offset: 2px; }

@media (max-width: 860px) {
  html, body { overflow: auto; }
  #app { position: static; }
  .tela { position: static; display: flex; flex-direction: column; }
  .cab { flex-wrap: wrap; align-items: flex-start; }
  .principal { justify-items: start; text-align: left; }
  .principal .num b { font-size: 32px; }
  .palco-area { height: 58vh; flex: none; }
  .barra { order: 3; }
  .lado-dir { order: 4; overflow: visible; }
  .lado-esq { order: 5; overflow: visible; }
  .tela.sem-paineis .lado-esq, .tela.sem-paineis .lado-dir { display: none; }
}

.dica, .status { position: absolute; left: 12px; max-width: min(460px, calc(100% - 24px)); padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.86); border: 1px solid var(--line); font-size: 12px; pointer-events: none; }
.dica { top: 10px; }
.dica b { color: var(--accent); }
.status { bottom: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
.status.ok { border-color: #2f9e5a; color: #1d6b3c; }
.dica.oculta { display: none; }
@media (max-width: 860px) { .dica { font-size: 11px; } }

.link-ra { display: inline-block; margin-top: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font-weight: 600; font-size: 12px; text-decoration: none; }
.link-ra:hover { background: var(--accent); color: #fff; }
.link-ra:focus-visible { outline: 3px solid var(--agua); outline-offset: 2px; }
.carregando { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; pointer-events: none; }
.tela.limpo { grid-template-columns: 0 1fr 0; grid-template-rows: 0 1fr 0; }
.tela.limpo .cab, .tela.limpo .barra, .tela.limpo .lado-esq, .tela.limpo .lado-dir, .tela.limpo .dica, .tela.limpo .status, .tela.limpo .rotulos, .tela.limpo .linhas { display: none; }
.titulo .integrantes { margin: 1px 0 0; color: var(--mute); font-size: 11.5px; }

</style>
</head>
